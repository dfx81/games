<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dayble Generator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Arial, sans-serif;
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px;
    gap: 16px;
  }
  h1 {
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 2px;
    border-bottom: 1px solid #ccc;
    width: 100%;
    max-width: 340px;
    text-align: center;
    padding-bottom: 10px;
  }
  .field {
    width: 100%;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  label {
    font-size: 12px;
    color: #555;
  }
  input[type="text"] {
    width: 100%;
    padding: 12px;
    border: 2px solid #ccc;
    font-size: 20px;
    font-family: Arial, sans-serif;
    font-weight: bold;
    letter-spacing: 6px;
    text-transform: uppercase;
    text-align: center;
    outline: none;
  }
  input:focus { border-color: #888; }
  .url-area {
    display: none;
    width: 100%;
    max-width: 340px;
    flex-direction: column;
    gap: 8px;
  }
  .url-area.show { display: flex; }
  .url-text {
    font-size: 12px;
    font-family: monospace;
    color: #333;
    word-break: break-all;
    border: 1px solid #ccc;
    padding: 10px;
    background: #f9f9f9;
    line-height: 1.5;
  }
  button {
    padding: 12px;
    font-size: 14px;
    font-weight: bold;
    font-family: Arial, sans-serif;
    background: #fff;
    border: 2px solid #ccc;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    touch-action: manipulation;
  }
  button:hover { border-color: #888; }
  button.copied { color: #6aaa64; border-color: #6aaa64; }
</style>
</head>
<body>
<h1>Dayble Generator</h1>

<div class="field">
  <label>Birthday person's name</label>
  <input type="text" id="to" maxlength="5" autocomplete="off" spellcheck="false">
</div>

<div class="field">
  <label>Your name</label>
  <input type="text" id="from" maxlength="5" autocomplete="off" spellcheck="false">
</div>

<div class="url-area" id="url-area">
  <div class="url-text" id="url-text"></div>
  <button id="copy-btn">Copy link</button>
</div>

<script>
const toEl   = document.getElementById('to');
const fromEl = document.getElementById('from');
const area   = document.getElementById('url-area');
const urlText= document.getElementById('url-text');
const copyBtn= document.getElementById('copy-btn');
let url = '';

function cleanTo(v)   { return v.replace(/[^a-zA-Z]/g,'').slice(0,5).toUpperCase(); }
function cleanFrom(v) { return v.replace(/[^a-zA-Z0-9]/g,'').slice(0,5).toUpperCase(); }
function base() { return location.href.replace(/generator\.html.*$/,''); }

function update() {
  const to   = cleanTo(toEl.value);     toEl.value   = to;
  const from = cleanFrom(fromEl.value); fromEl.value = from;
  if (to.length === 5 && from.length >= 1) {
    url = base() + '#' + btoa(to + '|' + from);
    urlText.textContent = url;
    area.classList.add('show');
  } else {
    area.classList.remove('show');
    url = '';
  }
}

toEl.addEventListener('input', update);
fromEl.addEventListener('input', update);

copyBtn.addEventListener('click', () => {
  if (!url) return;
  navigator.clipboard.writeText(url).then(() => {
    copyBtn.textContent = 'Copied!';
    copyBtn.classList.add('copied');
    setTimeout(() => { copyBtn.textContent = 'Copy link'; copyBtn.classList.remove('copied'); }, 2000);
  });
});
</script>
</body>
</html>
